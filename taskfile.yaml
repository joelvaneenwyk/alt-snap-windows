# yaml-language-server: $schema=https://taskfile.dev/schema.json
# cspell:ignore taskfile,vcpkg,msbuild,makefiles,deinit

version: "3"

vars:
  GREETING: Hello, World!

tasks:
  default:
    cmds:
      - task: setup

  cmake:
    cmds:
      - cmake -G "MinGW Makefiles" -B .output/task/mingw -S .
      - make --directory .output/task/mingw

  upgrade:
    cmds:
      - cmd: scoop update *

  scoop:
    status:
      - scoop --version
    cmds:
      - cmd: |
          pwsh -NoProfile -Command "iwr -useb get.scoop.sh | iex"

  setup:
    deps: [scoop]
    silent: true
    cmds:
      # https://www.mingw-w64.org/downloads/#mingw-builds
      - cmd: |
          scoop bucket add "main"
          scoop install --no-update-scoop "main/mingw"
          scoop install --no-update-scoop "main/mingw-winlibs"
          scoop install --no-update-scoop "main/rhash"
          scoop install --no-update-scoop "main/7zip"
          scoop install --no-update-scoop "main/tcc"
          scoop install --no-update-scoop "main/ninja"
          scoop install --no-update-scoop "main/msys2"
        platforms: [windows]
      - cmd: |
          scoop bucket add "versions"
          scoop install --no-update-scoop "versions/mingw-winlibs-ucrt"
          scoop install --no-update-scoop "versions/mingw-winlibs-ucrt-mcf"
          scoop install --no-update-scoop "versions/mingw-winlibs-llvm"
          scoop install --no-update-scoop "versions/mingw-winlibs-llvm-ucrt"
          scoop install --no-update-scoop "versions/mingw-winlibs-llvm-ucrt-mcf"
        platforms: [windows]

  build-make:
    deps:
      - build-win32-debug
      - build-win32-release
      - build-x64-debug
      - build-x64-release
    silent: false

  build-win32-release:
    cmds:
      - make -fMakefile

  build-win32-debug:
    cmds:
      - make -fMakefileDebug

  build-x64-release:
    cmds:
      - make -fMakefileX64

  build-x64-debug:
    cmds:
      - make -fMakefileX64Debug

  # Build using Clang
  build-clang-release:
    cmds:
      - make -fMakefileClang

  # Build using Clang [debug]
  build-clang-debug:
    cmds:
      - make -fMakefileClangDebug

  # Build using Tiny C Compiler
  build-tcc:
    cmds:
      - make -fMakefileTCC
