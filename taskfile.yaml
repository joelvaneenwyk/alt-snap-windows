# yaml-language-server: $schema=https://taskfile.dev/schema.json
# cspell:ignore taskfile,vcpkg,msbuild,makefiles,deinit

version: "3"

vars:
  BUILD_TOOLCHAIN:
  BUILD_ARCH: x86_64
  BUILD_CC: clang
  PACKAGE_PARTS:
    - "mingw-w64"
    - "{{.BUILD_TOOLCHAIN}}"
    - "{{.BUILD_ARCH}}"
  PACKAGE_NAME_PREFIX: '{{ without .PACKAGE_PARTS "" | join "-" }}'
  MSYS2_PACKAGES:
    - "git"
    - "ncurses"
    - "{{.PACKAGE_NAME_PREFIX}}-{{.BUILD_CC}}"
    - "{{.PACKAGE_NAME_PREFIX}}-binutils"
    - "{{.PACKAGE_NAME_PREFIX}}-cairo"
    - "{{.PACKAGE_NAME_PREFIX}}-clang"
    - "{{.PACKAGE_NAME_PREFIX}}-gcc"
    - "{{.PACKAGE_NAME_PREFIX}}-gdk-pixbuf2"
    - "{{.PACKAGE_NAME_PREFIX}}-glib2"
    - "{{.PACKAGE_NAME_PREFIX}}-gstreamer"
    - "{{.PACKAGE_NAME_PREFIX}}-libepoxy"
    - "{{.PACKAGE_NAME_PREFIX}}-ncurses"
    - "{{.PACKAGE_NAME_PREFIX}}-ntldd"
    - "{{.PACKAGE_NAME_PREFIX}}-openssl"
    - "{{.PACKAGE_NAME_PREFIX}}-pango"
    - "{{.PACKAGE_NAME_PREFIX}}-pkgconf"
    - "{{.PACKAGE_NAME_PREFIX}}-zlib"

tasks:
  default:
    cmds:
      - task: build

  cmake:
    cmds:
      - cmake -G "MinGW Makefiles" -B .output/task/mingw -S .
      - make --directory .output/task/mingw

  upgrade:
    cmds:
      - cmd: scoop update *

  scoop:
    status:
      - scoop --version
    cmds:
      - cmd: |
          pwsh -NoProfile -Command "iwr -useb get.scoop.sh | iex"

  build:
    deps: [install-dependencies]
    cmds:
      - task: build-x64-release

  setup:
    deps: [scoop]
    silent: true
    vars:
      SCOOP: scoop install --no-update-scoop
    cmds:
      - cmd: |
          scoop bucket add "main"
        platforms: [windows]
      - cmd: |
          {{.SCOOP}} main/mingw
          {{.SCOOP}} main/mingw-winlibs
          {{.SCOOP}} main/rhash
          {{.SCOOP}} main/7zip
          {{.SCOOP}} main/tcc
          {{.SCOOP}} main/ninja
          {{.SCOOP}} main/msys2
        platforms: [windows]
      - cmd: |
          scoop bucket add "versions"
        platforms: [windows]
      - cmd: |
          {{.SCOOP}} versions/mingw-winlibs-ucrt
          {{.SCOOP}} versions/mingw-winlibs-ucrt-mcf
          {{.SCOOP}} versions/mingw-winlibs-llvm
          {{.SCOOP}} versions/mingw-winlibs-llvm-ucrt
          {{.SCOOP}} versions/mingw-winlibs-llvm-ucrt-mcf
        platforms: [windows]

  build-make:
    deps:
      - build-win32-debug
      - build-win32-release
      - build-x64-debug
      - build-x64-release
    silent: false

  build-win32-release:
    cmds:
      - make -fMakefile

  build-win32-debug:
    cmds:
      - make -fMakefileDebug

  build-x64-release:
    cmds:
      - make -fMakefileX64

  build-x64-debug:
    cmds:
      - make -fMakefileX64Debug

  # Build using Clang
  build-clang-release:
    cmds:
      - make -fMakefileClang

  # Build using Clang [debug]
  build-clang-debug:
    cmds:
      - make -fMakefileClangDebug

  # Build using Tiny C Compiler
  build-tcc:
    cmds:
      - make -fMakefileTCC

  install-dependencies:
    deps: [install-packages-scoop-pkg-config]
    cmds:
      - task: install-packages

  scoop-install:
    desc: Install libraries with scoop
    status:
      - "scoop --version"
    cmds:
      - cmd: | # shell
          pwsh -NoProfile -Command 'iex "& {$(irm get.scoop.sh)} -RunAsAdmin"'
        platforms: [windows]
        ignore_error: true
      - cmd: pwsh -NoProfile -Command 'Join-Path (Resolve-Path ~).Path "scoop/shims" >> $Env:GITHUB_PATH'
        platforms: [windows]
        ignore_error: true

  update-packages:
    ignore_error: true
    cmds:
      - task: update-packages-pacman

  update-packages-pacman:
    deps: [pacman-unlock]
    cmds:
      - task: pacman-unlock
      - cmd: "pacman -Syu --noconfirm"
        ignore_error: true

  install-packages:
    cmds:
      - task: install-packages-scoop-pkg-config
      - task: install-packages-pacman

  install-packages-scoop-pkg-config:
    deps: [scoop-install]
    platforms: [windows]
    status:
      - pkg-config --version
    cmds:
      - cmd: |
          scoop install \
            extras/pkg-config-lite \
            main/winflexbison

  install-packages-pacman:
    vars:
      PACKAGES: '{{.MSYS2_PACKAGES | join " "}}'
    cmds:
      - task: pacman-unlock
      - cmd: "pacman -Syu --noconfirm"
        ignore_error: true
      - cmd: "pacman -S --needed --noconfirm {{ .PACKAGES }}"
        ignore_error: true
      - task: pacman-unlock

  install-each-package:
    deps: [update-packages]
    vars:
      PACKAGES: '{{.MSYS2_PACKAGES | join " "}}'
    cmds:
      - for:
          var: MSYS2_PACKAGES
        task: install-package-pacman
        vars:
          PACKAGE: "{{.ITEM}}"

  pacman-unlock:
    status:
      - "test ! -f /var/lib/pacman/db.lck"
    cmds:
      - cmd: "rm -f /var/lib/pacman/db.lck"
        ignore_error: true

  install-package-pacman:
    deps: [pacman-unlock]
    requires:
      vars: [PACKAGE]
    desc: "Install package {{.PACKAGE}}"
    preconditions:
      - "pacman --version"
    status:
      - "pacman -Qk {{.PACKAGE}}"
    cmds:
      - cmd: 'pacman -S --needed --noconfirm "{{.PACKAGE}}"'
